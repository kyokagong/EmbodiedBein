hydra:
  run:
    dir: .
  output_subdir: null
  job_logging:
    root:
      level: INFO

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: 0

runner:
  task_type: sft
  logger:
    log_path: /workspace/output
    project_name: rlinf
    experiment_name: robotwin_lingbot_vla2
    logger_backends: [tensorboard]
  max_epochs: -1
  max_steps: 100
  val_check_interval: -1
  save_interval: 100

data:
  train_data_paths: /workspace/data/robotwin

actor:
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 1
  global_batch_size: 4
  seed: 0
  model:
    model_type: lingbot_vla2
    model_path: /workspace/models/base
    tokenizer_path: /workspace/models/qwen3-vl
    precision: bf16
    is_lora: false
    action_dim: 55
    action_env_dim: 14
    num_action_chunks: 50
  optim:
    lr: 1.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.999
    adam_eps: 1.0e-8
    weight_decay: 0.01
    clip_grad: 1.0
    total_training_steps: 100
    lr_warmup_steps: 0
    lr_scheduler: constant
  fsdp_config:
    strategy: fsdp2
    sharding_strategy: full_shard
    gradient_checkpointing: false
    cpu_offload: false
    offload_pin_memory: false
    reshard_after_forward: true
    enable_gradient_accumulation: true
    forward_prefetch: true
    limit_all_gathers: true
    backward_prefetch: null
    use_orig_params: true
    use_liger_kernel: false
    disable: true
    wrap_policy:
      transformer_layer_cls_to_wrap: [Qwen3VLDecoderLayer]
    save_full_model_weights: true
    mixed_precision:
      param_dtype: bf16
      reduce_dtype: fp32
      buffer_dtype: bf16
    amp_autocast:
      enabled: false
      precision: bf16
    grad_scaler:
      enabled: false
