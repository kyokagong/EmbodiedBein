[package]
name = "ebd"
version.workspace = true
edition.workspace = true

[[bin]]
name = "ebd"
path = "src/main.rs"

[dependencies]
eb-core = { path = "../eb-core" }
eb-probe = { path = "../eb-probe" }
eb-runner = { path = "../eb-runner" }
eb-tsdb = { path = "../eb-tsdb" }
eb-collector = { path = "../eb-collector" }
eb-scanner = { path = "../eb-scanner" }
eb-artifact = { path = "../eb-artifact" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
axum = { workspace = true, features = ["ws"] }
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
sha2.workspace = true
futures-util = { version = "0.3", default-features = false, features = ["std"] }
libc = "0.2"

[dev-dependencies]
tower = { workspace = true, features = ["util"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
