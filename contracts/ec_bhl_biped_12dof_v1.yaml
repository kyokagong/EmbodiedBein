id: ec_bhl_biped_12dof_v1
robot_family: berkeley_humanoid_lite
morphology: biped
interface_version: 1
status: active
dof: 12
joint_groups:
  leg: { count: 12 }
joint_order:
  - leg_left_hip_roll_joint
  - leg_left_hip_yaw_joint
  - leg_left_hip_pitch_joint
  - leg_left_knee_pitch_joint
  - leg_left_ankle_pitch_joint
  - leg_left_ankle_roll_joint
  - leg_right_hip_roll_joint
  - leg_right_hip_yaw_joint
  - leg_right_hip_pitch_joint
  - leg_right_knee_pitch_joint
  - leg_right_ankle_pitch_joint
  - leg_right_ankle_roll_joint
observation:
  dim: 45
  history_length: 1
  concat: true
  layout:
    - { term: velocity_commands, dim: 3, source: command }
    - { term: base_ang_vel, dim: 3, source: imu }
    - { term: projected_gravity, dim: 3, source: imu }
    - { term: joint_pos_rel, dim: 12, source: encoder }
    - { term: joint_vel_rel, dim: 12, source: encoder }
    - { term: last_action, dim: 12, source: policy }
action:
  dim: 12
  type: joint_position
  scale: 0.25
  offset: default_joint_pos
control:
  policy_hz: 25
  control_hz: 200
  sim_dt: 0.005
  decimation: 8
  max_policy_latency_ms: 12
sim_bindings:
  isaac_task: Velocity-Berkeley-Humanoid-Lite-Biped-v0
  experiment_name: biped
  mjcf: robots/berkeley_humanoid/berkeley_humanoid_lite/mjcf/berkeley_humanoid_lite_biped.xml
  usd: robots/berkeley_humanoid/berkeley_humanoid_lite/usd/berkeley_humanoid_lite_biped.usd
real_bindings:
  udp: { obs_port: 10000, action_port: 10001, viz_port: 10002, joystick_port: 10011 }
  motor_bus: socketcan
  firmware_n_joints: 12
