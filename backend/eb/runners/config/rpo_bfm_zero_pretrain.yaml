defaults:
  - model/mlp_policy@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - _self_
  - override hydra/job_logging: stdout

hydra:
  run: {dir: .}
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor, env, rollout: 0

runner:
  task_type: embodied
  logger:
    log_path: /workspace/output
    project_name: rlinf
    experiment_name: rpo_v2_bfm_zero_pretrain
    logger_backends: [tensorboard]
  max_epochs: 2
  max_steps: -1
  only_eval: false
  use_training_pipeline: false
  overlap_env_bootstrap: false
  val_check_interval: -1
  save_interval: 1
  resume_dir: null
  ckpt_path: null

algorithm:
  loss_type: bfm_zero
  update_epoch: 1
  normalize_advantages: false
  kl_penalty: kl
  group_size: 1
  reward_type: action_level
  logprob_type: action_level
  entropy_type: action_level
  adv_type: gae
  loss_agg_func: token-mean
  bootstrap_type: standard
  gamma: 0.98
  gae_lambda: 1.0

env:
  group_name: EnvGroup
  train: &env
    env_type: isaaclab
    total_num_envs: 4
    auto_reset: true
    ignore_terminations: false
    use_rel_reward: false
    seed: 42
    group_size: 1
    reward_coef: 1.0
    use_fixed_reset_state_ids: false
    rollout_epoch: 1
    max_episode_steps: 1000
    max_steps_per_rollout_epoch: 4
    video_cfg: {save_video: false, info_on_video: false, fps: 50, video_base_dir: /workspace/output/video/train}
    init_params:
      id: RPO-BFM-Pretrain-v1
      num_envs: null
      max_episode_steps: ${..max_episode_steps}
      task_description: RPO V2 BFM-Zero online interaction with pinned observation-only expert motion.
  eval:
    <<: *env
    total_num_envs: 1
    seed: 42
    use_fixed_reset_state_ids: true
    max_steps_per_rollout_epoch: 1000
    video_cfg: {save_video: false, info_on_video: false, fps: 50, video_base_dir: /workspace/output/video/eval}

rollout:
  group_name: RolloutGroup
  backend: huggingface
  enable_offload: false
  pipeline_stage_num: 1
  enable_torch_compile: false
  enable_cuda_graph: false
  collect_transitions: true
  collect_prev_infos: true
  model:
    model_path: ""
    precision: "${actor.model.precision}"

actor:
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 8
  global_batch_size: 8
  seed: 42
  enable_offload: false
  model:
    model_path: ""
    model_type: mlp_policy
    policy_setup: rpo-v2-bfm-zero
    obs_dim: 375
    critic_obs_dim: 733
    action_dim: 23
    num_action_chunks: 1
    precision: "32"
    add_value_head: false
    is_lora: false
    bfm_profile: bringup
    motion_root: ""
    asset_sha256: ""
    batch_size: ${actor.global_batch_size}
    updates_per_round: 1
    replay_capacity: 100000
    learning_rates:
      actor: 0.0003
      forward_map: 0.0001
      backward_map: 0.0001
      discriminator: 0.0001
      critic: 0.0001
      aux_critic: 0.0001
    learning:
      seed: 42
      gamma: 0.98
      goal_ratio: 0.2
      expert_ratio: 0.6
      gradient_penalty: 10.0
      ortho_coef: 100.0
      pessimism: 0.5
      reg_coeff: 0.05
      reg_coeff_aux: 0.02
      fb_tau: 0.01
      critic_tau: 0.005
      max_grad_norm: 10.0
  optim:
    lr: 0.0003
    value_lr: 0.0001
    adam_beta1: 0.9
    adam_beta2: 0.999
    adam_eps: 1.0e-8
    weight_decay: 0.0
    clip_grad: 10.0
  fsdp_config:
    strategy: fsdp
    sharding_strategy: no_shard
    use_orig_params: true
    mixed_precision:
      param_dtype: "${actor.model.precision}"
      reduce_dtype: "${actor.model.precision}"
      buffer_dtype: "${actor.model.precision}"

reward: {use_reward_model: false}
critic: {use_critic_model: false}
