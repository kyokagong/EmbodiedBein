id: ee_rpo_v2_bfm_23dof_v1
embodiment_id: emb_roboparty_rpo
robot_family: roboparty_rpo_v2
morphology: humanoid
interface_version: 1
status: draft
dof: 23
joint_groups:
  leg: {count: 12}
  torso: {count: 1}
  arm: {count: 10}
joint_order:
  - left_thigh_yaw_joint
  - right_thigh_yaw_joint
  - torso_joint
  - left_thigh_roll_joint
  - right_thigh_roll_joint
  - left_arm_pitch_joint
  - right_arm_pitch_joint
  - left_thigh_pitch_joint
  - right_thigh_pitch_joint
  - left_arm_roll_joint
  - right_arm_roll_joint
  - left_knee_joint
  - right_knee_joint
  - left_arm_yaw_joint
  - right_arm_yaw_joint
  - left_ankle_pitch_joint
  - right_ankle_pitch_joint
  - left_elbow_pitch_joint
  - right_elbow_pitch_joint
  - left_ankle_roll_joint
  - right_ankle_roll_joint
  - left_elbow_yaw_joint
  - right_elbow_yaw_joint
observation:
  dim: 375
  critic_dim: 733
  history_length: 4
  history_preflattened: true
  concat: true
  groups: {states: 52, last_action: 23, history_actor: 300, privileged_state: 358}
  layout:
    - {term: q_minus_default, dim: 23, source: encoder}
    - {term: dq_radps, dim: 23, source: encoder}
    - {term: gravity_body, dim: 3, source: imu}
    - {term: omega_body_div4, dim: 3, source: imu}
    - {term: last_executed_action, dim: 23, source: policy}
    - {term: previous_four_frames, dim: 300, source: history}
  critic_layout:
    - {term: actor_observation, dim: 375, source: actor}
    - {term: privileged_state, dim: 358, source: simulator}
  privileged_body_count: 24
  quaternion: wxyz
  history_layout: frame_major_oldest_first_zero_pad
  privileged_velocity_point: link_origin
action:
  dim: 23
  type: joint_position
  scale: 0.25
  offset: default_joint_pos
  gain: [1, 2, 2, 1, 1, 2, 2, 6, 4, 2, 1, 9, 7, 3, 2, 2, 3, 2, 3, 1, 1, 1, 1]
  policy_bounds: [-1, 1]
control:
  policy_hz: 50
  control_hz: 200
  sim_dt: 0.005
  decimation: 4
  actuator_delay_steps: 0
  command_dim: 3
prompt:
  latent_dim: 256
  radius: 16
  modes: [goal, tracking, reward]
  command_input: {field: commands, dim: 3, units: [m/s, m/s, rad/s], minimum: [-0.6, -0.5, -1.57], maximum: [1.0, 0.5, 1.57], consumer: command_to_latent}
sim_bindings:
  isaac_task: RPO-BFM-Pretrain-v1
  experiment_name: rpo_v2_bfm_zero_pretrain
  mjcf: rpo_description/mjcf/rpo.xml
