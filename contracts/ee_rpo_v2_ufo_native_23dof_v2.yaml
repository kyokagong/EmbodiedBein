    - {term: actor_observation, dim: 375, source: actor}
    - {term: privileged_state, dim: 358, source: simulator}
action: {dim: 23, type: joint_position, scale: 1.0, offset: native_default_plus_effort_kp_gain}
control: {policy_hz: 50, control_hz: 400, sim_dt: 0.0025, decimation: 8}
gains:
  codec_schema: eb/ufo-native-codec/v1
  history_order: [actions, base_ang_vel, dof_pos, dof_vel, projected_gravity]
  history_oldest_first: false
  history_includes_current: false
  prompt_dim: 256
  onnx_actor_dim: 631
  input_quaternion: xyzw
  action_mapping: q_default_plus_clip_action_times5_times_0.6_times_effort_over_kp
limits: {scope: simulation_only, hardware_verified: false}
sim_bindings: {mjcf: assets/rpo.xml}
